name: neospend
description: "Neospend - AI-based smart expense and financial behaviour analyzer."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  provider: ^6.1.1
  go_router: ^17.5.0

  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0

  fl_chart: ^1.2.0
  google_fonts: ^8.2.1
  intl: ^0.20.2
  http: ^1.3.0

  shared_preferences: ^2.5.1
  crypto: ^3.0.6
  local_auth: ^2.3.0
  share_plus: ^10.1.4
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/logo.png
